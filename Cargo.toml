[package]
name = "targz-launchpad"
version = "1.0.0"
edition = "2021"
description = "Menu-bar launcher for the local dev projects in ~/Documents/GIT"

[dependencies]
eframe = "0.29"
winit = "0.30"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"
dispatch = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSEnumerator"] }

[profile.release]
opt-level = 3
strip = true
