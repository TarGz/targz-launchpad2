[package]
name = "targz-launchpad"
version = "1.4.2"
edition = "2021"
description = "Menu-bar launcher for the local dev projects in ~/Documents/GIT"

[dependencies]
eframe = "0.29"
# Skew — the targz design system — as painted egui parts. A git dependency
# pinned by revision, because CI checks out this repo alone and cannot see
# ../targz-design-system (rust/skew-egui/README.md, "How an app takes it").
# NO REV: the branch, so a release always takes the parts as they stand. A
# pinned rev means a design-system commit reaches this app only when somebody
# remembers to copy a SHA in here, and for twenty-odd commits nobody did — the
# app built in place used the checkout next door through [patch] below and
# looked right, while every release went out against a crate from months back.
# The release workflow refreshes the lock, which is what actually moves it.
# default-features = false: the crate's key-click sound bank stays off.
skew-egui = { git = "https://github.com/TarGz/targz-design-system.git", branch = "master", default-features = false }
winit = "0.30"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"
dispatch = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSEnumerator"] }

# While changing a part and this app at the same time, point the dependency at
# the local checkout — and take this block out again before pushing, because CI
# cannot see that folder:
#
# [patch."https://github.com/TarGz/targz-design-system.git"]
# skew-egui = { path = "../targz-design-system/rust/skew-egui" }

[profile.release]
opt-level = 3
strip = true
